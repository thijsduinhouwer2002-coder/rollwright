# Sjabloon: release-workflow voor een Obsidian-plugin in zijn eigen openbare repo.
# Kopieer naar .github/workflows/release.yml in de plugin-repo.
# Elke push: installeren, testen, bouwen (controle).
# Een release komt er alleen als het commitbericht "[release]" bevat
# en er nog geen tag bestaat met de versie uit manifest.json.
name: Bouwen en release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bouwen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Versie lezen
        id: v
        run: echo "versie=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"
      - name: Release maken
        if: contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.versie }}
        run: |
          if gh release view "$V" >/dev/null 2>&1; then echo "release $V bestaat al, niets gedaan"; exit 0; fi
          FILES="main.js manifest.json"; [ -f styles.css ] && FILES="$FILES styles.css"
          NOTES=$(awk -v v="$V" '$0 ~ "^## .*"v {f=1;next} /^## /{if(f)exit} f' CHANGELOG.md 2>/dev/null)
          gh release create "$V" $FILES --title "$V" --notes "${NOTES:-Rollwright $V}"
          echo "Release $V gemaakt"
